<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>WIDS-STORE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0c;--s:#121216;--tx:#eef0f6;--mu:#8b90a3;--cy:#22e5ff;--vi:#8b5cf6;--em:#34d399;--bd:rgba(255,255,255,.09);--gl:rgba(255,255,255,.05);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:400 15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(60% 40% at 90% -5%,rgba(139,92,246,.28),transparent),radial-gradient(50% 35% at -10% 20%,rgba(34,229,255,.16),transparent);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(10,10,12,.85);backdrop-filter:blur(16px)}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(10,10,12,.7);backdrop-filter:blur(18px);border-bottom:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px;font-size:18px}
.logo i{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-style:normal;background:linear-gradient(135deg,var(--cy),var(--vi));color:#06060a;box-shadow:0 0 22px rgba(34,229,255,.55)}
.logo b{background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{position:relative;width:42px;height:42px;border-radius:14px;background:var(--gl);border:1px solid var(--bd);display:grid;place-items:center;font-size:18px;transition:.2s}
.ib:active{transform:scale(.92)}
.dot{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--cy);color:#06060a;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
main{max-width:640px;margin:0 auto;padding:16px 16px 110px}
h2{font-size:18px;font-weight:800;margin:24px 0 12px}
.glass{background:var(--gl);border:1px solid var(--bd);border-radius:22px;backdrop-filter:blur(14px)}
.hero{padding:22px;position:relative;overflow:hidden;border-color:rgba(34,229,255,.28);box-shadow:0 0 40px rgba(139,92,246,.15) inset}
.hero h1{font-size:26px;line-height:1.15;font-weight:800;max-width:15ch}
.hero p{color:var(--mu);margin:8px 0 16px;max-width:30ch}
.stats{display:flex;gap:10px}.stats div{flex:1;padding:10px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid var(--bd);font-size:12px;color:var(--mu)}.stats b{display:block;font-size:16px;color:var(--tx)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;font-weight:800;color:#06060a;background:linear-gradient(90deg,var(--cy),#7aa2ff 55%,var(--vi));box-shadow:0 8px 28px rgba(34,229,255,.25);transition:.2s}
.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.4;box-shadow:none}
.btn.g{background:var(--gl);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.search{width:100%;padding:14px 16px;border-radius:16px;background:var(--s);border:1px solid var(--bd);margin:14px 0 4px}
.search:focus{border-color:var(--cy);outline:0;box-shadow:0 0 0 3px rgba(34,229,255,.15)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:99px;background:var(--gl);border:1px solid var(--bd);color:var(--mu);font-weight:600;font-size:13px;transition:.2s}
.chip.on{color:#06060a;background:var(--cy);border-color:var(--cy);box-shadow:0 0 18px rgba(34,229,255,.4)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{text-align:left;padding:14px;display:flex;flex-direction:column;gap:8px;transition:.25s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:rgba(34,229,255,.45);box-shadow:0 10px 30px rgba(34,229,255,.12)}
.card:active{transform:scale(.97)}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,rgba(34,229,255,.22),rgba(139,92,246,.28));border:1px solid var(--bd)}
.card strong{font-size:14px}.card small{color:var(--mu)}.card em{font-style:normal;color:var(--cy);font-weight:800;font-size:13px}
.bg{display:flex;flex-wrap:wrap;gap:4px}.bg span{font-size:10px;font-weight:700;padding:3px 7px;border-radius:99px;border:1px solid currentColor}
.promo{display:flex;align-items:center;gap:14px;padding:18px;text-align:left;width:100%;margin-top:12px;border-color:rgba(52,211,153,.4);background:linear-gradient(120deg,rgba(52,211,153,.14),rgba(139,92,246,.14))}
.promo .ico{font-size:30px;width:56px;height:56px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(14,14,18,.85);backdrop-filter:blur(20px);border-top:1px solid var(--bd)}
nav button{flex:1;max-width:120px;padding:6px;border-radius:14px;color:var(--mu);font-size:11px;font-weight:600;display:grid;gap:2px;justify-items:center;transition:.2s}
nav button span{font-size:20px}nav button.on{color:var(--cy)}nav button.on span{filter:drop-shadow(0 0 8px var(--cy))}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:f .2s}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--s);border:1px solid var(--bd);border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:u .28s cubic-bezier(.2,.8,.2,1)}
.co{align-items:stretch}.co .sheet{max-height:100%;border-radius:0;height:100%}
@keyframes u{from{transform:translateY(40px);opacity:0}}@keyframes f{from{opacity:0}}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pack{padding:12px;border-radius:16px;background:var(--gl);border:1px solid var(--bd);text-align:left;transition:.2s}
.pack b{display:block;font-size:14px}.pack span{color:var(--cy);font-size:13px;font-weight:700}
.pack.on{border-color:var(--cy);background:rgba(34,229,255,.1);box-shadow:0 0 20px rgba(34,229,255,.2)}
label{display:block;font-size:12px;color:var(--mu);font-weight:600;margin:12px 0 6px}
.inp{width:100%;padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--bd)}
.inp:focus{border-color:var(--cy);outline:0}.inp.bad{border-color:#ff5c7a}
.err{color:#ff7d94;font-size:12px;min-height:16px;margin-top:6px}
.qty{display:flex;align-items:center;gap:12px}.qty button{width:36px;height:36px;border-radius:12px;background:var(--gl);border:1px solid var(--bd);font-size:18px}
.line{display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:10px}.line div:nth-child(2){flex:1;min-width:0}.line small{color:var(--mu);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding:14px 0}.tot span:last-child{color:var(--cy)}
.steps{display:flex;gap:6px;margin:14px 0 18px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--bd)}.steps i.on{background:linear-gradient(90deg,var(--cy),var(--vi));box-shadow:0 0 10px var(--cy)}
.nat{padding:18px;text-align:center;border-color:rgba(52,211,153,.45);background:linear-gradient(160deg,rgba(52,211,153,.12),rgba(0,0,0,.2))}
.nat .num{font-size:24px;font-weight:800;letter-spacing:1px;color:var(--em);text-shadow:0 0 18px rgba(52,211,153,.5);margin:6px 0 12px}
.nat .amt{font-size:30px;font-weight:800}
ol{padding-left:20px;color:var(--mu);margin:14px 0}ol li{margin-bottom:6px}
.ok{text-align:center;padding:30px 0}.ok .tick{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:rgba(52,211,153,.15);border:2px solid var(--em);box-shadow:0 0 40px rgba(52,211,153,.5);animation:p .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes p{from{transform:scale(.3);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:30;padding:11px 18px;border-radius:99px;background:rgba(30,30,38,.95);border:1px solid var(--cy);font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
#toast.s{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.pill{padding:0 12px;height:42px;border-radius:14px;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);color:var(--em);font-weight:800;font-size:13px}
.dr{align-items:stretch;justify-content:flex-start}.drawer{width:82%;max-width:320px;background:var(--s);border-right:1px solid var(--bd);padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px;display:flex;flex-direction:column;gap:6px;animation:l .25s}
@keyframes l{from{transform:translateX(-30px);opacity:0}}
.drawer button.mi{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;font-weight:600;text-align:left}.drawer button.mi:active,.drawer button.mi.on{background:rgba(34,229,255,.1);color:var(--cy)}
.rvs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}.rvs::-webkit-scrollbar{display:none}
.rv{flex:0 0 86%;scroll-snap-align:start;padding:16px}.rvs.col{flex-direction:column;overflow:visible}.rvs.col .rv{flex:auto}
.st{color:#fbbf24;letter-spacing:2px;text-shadow:0 0 10px rgba(251,191,36,.5)}.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#06060a;background:linear-gradient(135deg,var(--cy),var(--vi))}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><button class="ib" id="menuBtn" aria-label="Ouvrir le menu">☰</button><div class="logo"><i>W</i><span>WIDS<b>-STORE</b></span></div><div class="row" style="gap:8px"><button class="pill" data-t="bal" id="balPill" aria-label="Ma balance">0 HTG</button><button class="ib" id="cartBtn" aria-label="Ouvrir le panier">🛒<span class="dot" id="dot" hidden>0</span></button></div></header>
<main id="app"></main>
<nav id="nav"><button data-t="home"><span>🏠</span>Accueil</button><button data-t="cat"><span>🧩</span>Catalogue</button><button data-t="ef"><span>⚽</span>eFootball</button><button data-t="bal"><span>💳</span>Balance</button><button data-t="cart"><span>🛒</span>Panier</button></nav>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString("en-US")+" HTG";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NAT="+509 4196 4062",NATRAW="+50941964062";
const BG={pop:["Populaire","#a78bfa"],ins:["Instantané","#22e5ff"],h24:["Dispo 24/7","#34d399"]};
const CATS={all:"Tout",recharge:"Recharges",jeux:"Jeux",stream:"Streaming",cartes:"Cartes cadeaux",ef:"eFootball"};
const pk=a=>a.map(([l,p])=>({l,p}));
/* Prix indicatifs en HTG : à ajuster ici */
const P=[
{id:"ef",c:"ef",n:"eFootball Coins",i:"⚽",b:["pop","ins","h24"],idl:"ID joueur eFootball",v:pk([["130 Coins",250],["300 Coins",550],["550 Coins",950],["1,040 Coins",1800],["2,130 Coins",3600],["3,250 Coins",5400]])},
{id:"dig",c:"recharge",n:"Digicel Crédit",i:"📱",b:["ins","h24"],idl:"Numéro Digicel",v:pk([["Crédit 100",100],["Crédit 250",250],["Crédit 500",500],["Crédit 1,000",1000]])},
{id:"ntc",c:"recharge",n:"Natcom Crédit",i:"📶",b:["ins","h24"],idl:"Numéro Natcom",v:pk([["Crédit 100",100],["Crédit 250",250],["Crédit 500",500],["Crédit 1,000",1000]])},
{id:"ff",c:"jeux",n:"Free Fire Diamants",i:"🔥",b:["pop","ins"],idl:"ID joueur Free Fire",v:pk([["100 Diamants",150],["310 Diamants",420],["520 Diamants",690],["1,060 Diamants",1350]])},
{id:"pubg",c:"jeux",n:"PUBG Mobile UC",i:"🎯",b:["ins","h24"],idl:"ID joueur PUBG",v:pk([["60 UC",130],["325 UC",650],["660 UC",1300],["1,800 UC",3250]])},
{id:"net",c:"stream",n:"Netflix",i:"🎬",b:["pop"],idl:"Adresse e-mail du compte",v:pk([["1 mois · Standard",1800],["1 mois · Premium",2500]])},
{id:"spo",c:"stream",n:"Spotify Premium",i:"🎧",b:["h24"],idl:"Adresse e-mail du compte",v:pk([["1 mois",900],["3 mois",2500]])},
{id:"ps",c:"cartes",n:"PlayStation Store",i:"🎮",b:["pop","ins"],idl:"E-mail pour recevoir le code",v:pk([["Carte 10 USD",1700],["Carte 25 USD",4100],["Carte 50 USD",8100]])},
{id:"stm",c:"cartes",n:"Steam Wallet",i:"💻",b:["ins","h24"],idl:"E-mail pour recevoir le code",v:pk([["Carte 10 USD",1700],["Carte 20 USD",3300]])},
{id:"gp",c:"cartes",n:"Google Play",i:"▶️",b:["ins"],idl:"E-mail pour recevoir le code",v:pk([["Carte 10 USD",1700],["Carte 25 USD",4100]])}
];
let tab="home",cat="all",q="",cart=[],efPack=0,efId="",bal=0,reqs=[];
try{cart=JSON.parse(localStorage.getItem("wids-cart")||"[]");reqs=JSON.parse(localStorage.getItem("wids-reqs")||"[]");bal=+localStorage.getItem("wids-bal")||0}catch(e){}
const save=()=>{try{localStorage.setItem("wids-cart",JSON.stringify(cart))}catch(e){}};
const prod=id=>P.find(p=>p.id===id);
const IC={ef:["#16a34a","#0ea5e9"],dig:["#ef4444","#b91c1c"],ntc:["#f59e0b","#ea580c"],ff:["#f97316","#facc15"],pubg:["#eab308","#78716c"],net:["#e50914","#7f0a10"],spo:["#1db954","#0b3d1e"],ps:["#2563eb","#1e3a8a"],stm:["#334155","#0ea5e9"],gp:["#22c55e","#3b82f6"]};
const ico=p=>{const c=IC[p.id];return `<div class="ico" style="background:linear-gradient(135deg,${c[0]},${c[1]});box-shadow:0 0 16px ${c[0]}66;border-color:transparent">${p.i}</div>`};
const total=()=>cart.reduce((t,l)=>t+prod(l.pid).v[l.vi].p*l.q,0);
const count=()=>cart.reduce((t,l)=>t+l.q,0);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("s");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("s"),1900)}
function card(p){const min=Math.min(...p.v.map(v=>v.p));return `<button class="glass card" data-p="${p.id}">${ico(p)}<strong>${p.n}</strong><div class="bg">${p.b.map(k=>`<span style="color:${BG[k][1]}">${BG[k][0]}</span>`).join("")}</div><em>dès ${fmt(min)}</em></button>`}
function filtered(){const s=q.trim().toLowerCase();return P.filter(p=>(cat==="all"||p.c===cat)&&(!s||p.n.toLowerCase().includes(s)))}
function chips(){return `<div class="chips">${Object.entries(CATS).map(([k,v])=>`<button class="chip ${k===cat?"on":""}" data-c="${k}">${v}</button>`).join("")}</div>`}
function view(){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
 const n=count(),d=$("#dot");d.hidden=!n;d.textContent=n;$("#balPill").textContent=fmt(bal);
 const a=$("#app");
 if(tab==="home")a.innerHTML=`<section class="glass hero"><h1>Recharge. Paie. Reçois.</h1><p>Jeux, crédit et abonnements payés en gourdes via Natcash.</p><div class="stats"><div><b>24/7</b>Toujours ouvert</div><div><b>HTG</b>Prix en gourdes</div><div><b>Natcash</b>Paiement local</div></div></section>
 <button class="glass promo" data-t="ef"><div class="ico">⚽</div><div><strong>eFootball Coins</strong><br><small style="color:var(--mu)">Choisis ton pack, entre ton ID, c’est parti. Dès ${fmt(250)}</small></div></button>
 <input class="search" id="s" placeholder="Rechercher un service…" aria-label="Rechercher" value="${esc(q)}">${chips()}<h2>Populaires</h2><div class="grid">${P.filter(p=>p.b.includes("pop")).map(card).join("")}</div><h2>Ils nous font confiance</h2>${reviewsHTML(false)}`;
 if(tab==="cat"){const l=filtered();a.innerHTML=`<input class="search" id="s" placeholder="Rechercher un service…" aria-label="Rechercher" value="${esc(q)}">${chips()}<div class="grid">${l.map(card).join("")}</div>${l.length?"":`<div class="empty">Aucun service trouvé. Essaie un autre mot.</div>`}`}
 if(tab==="ef"){const p=prod("ef");a.innerHTML=`<h2 style="margin-top:6px">⚽ eFootball Coins</h2><div class="bg" style="margin-bottom:8px">${p.b.map(k=>`<span style="color:${BG[k][1]}">${BG[k][0]}</span>`).join("")}</div>
 <label for="efid">ID joueur eFootball</label><input class="inp" id="efid" placeholder="Ex. 4A7B2C9D" value="${esc(efId)}" autocomplete="off"><div class="err" id="efe"></div>
 <div class="pk">${p.v.map((v,i)=>`<button class="pack ${i===efPack?"on":""}" data-ep="${i}"><b>🪙 ${v.l}</b><span>${fmt(v.p)}</span></button>`).join("")}</div>
 <button class="btn" id="efadd">Ajouter · ${fmt(p.v[efPack].p)}</button>`}
 if(tab==="cart"){a.innerHTML=cartHTML()}
 if(tab==="bal")a.innerHTML=balHTML();
 if(tab==="avis")a.innerHTML=`<h2 style="margin-top:6px">Avis clients</h2>${reviewsHTML(true)}`;
}
function cartHTML(){if(!cart.length)return `<div class="empty"><div style="font-size:44px">🛒</div><p style="margin:8px 0 16px">Ton panier est vide.</p><button class="btn" data-t="cat">Voir le catalogue</button></div>`;
 return `<h2 style="margin-top:6px">Panier</h2>${cart.map((l,i)=>{const p=prod(l.pid),v=p.v[l.vi];return `<div class="glass line">${ico(p)}<div><strong>${p.n}</strong><small>${v.l} · ${esc(l.gid)}</small><em style="color:var(--cy);font-style:normal;font-weight:700">${fmt(v.p*l.q)}</em></div><div class="qty"><button data-m="${i}" aria-label="Moins">−</button><b>${l.q}</b><button data-a="${i}" aria-label="Plus">+</button></div></div>`}).join("")}<div class="tot"><span>Total</span><span>${fmt(total())}</span></div><button class="btn" id="go">Valider la commande</button>`}
function addCart(pid,vi,gid,q){const l=cart.find(x=>x.pid===pid&&x.vi===vi&&x.gid===gid);l?l.q+=q:cart.push({pid,vi,gid,q});save();toast("Ajouté au panier ✓");view()}
function close(){document.querySelectorAll(".ov").forEach(o=>o.remove())}
function openSheet(pid){
 const p=prod(pid);let vi=0,qn=1;close();
 const o=document.createElement("div");o.className="ov";document.body.appendChild(o);
 const draw=()=>{const keep=o.querySelector("#gid")?.value||"";o.innerHTML=`<div class="sheet" role="dialog" aria-label="${p.n}"><div class="row"><div class="row" style="justify-content:flex-start">${ico(p)}<strong style="font-size:17px">${p.n}</strong></div><button class="ib" data-x aria-label="Fermer">✕</button></div>
 <div class="pk">${p.v.map((v,i)=>`<button class="pack ${i===vi?"on":""}" data-v="${i}"><b>${v.l}</b><span>${fmt(v.p)}</span></button>`).join("")}</div>
 <label for="gid">${p.idl}</label><input class="inp" id="gid" autocomplete="off" value="${esc(keep)}"><div class="err" id="ge"></div>
 <div class="row" style="margin:10px 0 16px"><span style="color:var(--mu)">Quantité</span><div class="qty"><button data-d="-1" aria-label="Moins">−</button><b>${qn}</b><button data-d="1" aria-label="Plus">+</button></div></div>
 <button class="btn" id="ad">Ajouter · ${fmt(p.v[vi].p*qn)}</button></div>`};
 draw();
 o.addEventListener("click",e=>{const t=e.target;
  if(t===o||t.closest("[data-x]"))return close();
  const v=t.closest("[data-v]"),d=t.closest("[data-d]");
  if(v){vi=+v.dataset.v;draw();o.querySelector("#gid").focus()}
  else if(d){qn=Math.max(1,Math.min(20,qn+ +d.dataset.d));draw()}
  else if(t.closest("#ad")){const g=o.querySelector("#gid").value.trim();if(g.length<3){o.querySelector("#gid").classList.add("bad");o.querySelector("#ge").textContent=`Renseigne : ${p.idl.toLowerCase()} (3 caractères minimum).`;return}addCart(pid,vi,g,qn);close()}
 })}
/* Tunnel de commande */
function openCheckout(){
 if(!cart.length)return;close();let step=1,info={name:"",tel:""},done=null;
 const o=document.createElement("div");o.className="ov co";document.body.appendChild(o);
 const bar=()=>`<div class="row"><strong style="font-size:18px">Commande</strong><button class="ib" data-x aria-label="Fermer">✕</button></div><div class="steps">${[1,2,3].map(n=>`<i class="${n<=step?"on":""}"></i>`).join("")}</div>`;
 const recap=()=>cart.map(l=>{const p=prod(l.pid),v=p.v[l.vi];return `<div class="row" style="padding:6px 0"><span>${p.i} ${v.l} ×${l.q}<br><small style="color:var(--mu)">${esc(l.gid)}</small></span><b>${fmt(v.p*l.q)}</b></div>`}).join("");
 const draw=()=>{
  if(done){o.innerHTML=`<div class="sheet"><div class="ok"><div class="tick">✓</div><h2 style="margin:0 0 6px">Commande envoyée</h2><p style="color:var(--mu)">Référence <b style="color:var(--cy)">${done.ref}</b><br>Nous vérifions ton paiement de ${fmt(done.t)} puis livrons ta commande.</p></div><button class="btn" data-x>Retour à la boutique</button></div>`;return}
  if(step===1)o.innerHTML=`<div class="sheet">${bar()}<h2 style="margin-top:0">1 · Panier</h2><div class="glass" style="padding:12px 16px">${recap()}</div><div class="tot"><span>Total</span><span>${fmt(total())}</span></div><button class="btn" data-n>Continuer</button></div>`;
  if(step===2)o.innerHTML=`<div class="sheet">${bar()}<h2 style="margin-top:0">2 · Tes informations</h2><label for="nm">Nom complet</label><input class="inp" id="nm" autocomplete="name" value="${esc(info.name)}"><label for="tl">Téléphone / WhatsApp</label><input class="inp" id="tl" inputmode="tel" autocomplete="tel" placeholder="+509 …" value="${esc(info.tel)}"><div class="err" id="e2"></div><div class="tot"><span>Total</span><span>${fmt(total())}</span></div><button class="btn" data-n>Passer au paiement</button><button class="btn g" data-b style="margin-top:10px">Retour</button></div>`;
  if(step===3)o.innerHTML=`<div class="sheet">${bar()}<h2 style="margin-top:0">3 · Paiement Natcash</h2><div class="glass nat"><small style="color:var(--mu)">Montant exact à envoyer</small><div class="amt">${fmt(total())}</div><small style="color:var(--mu)">Numéro Natcash</small><div class="num">${NAT}</div><button class="btn g" data-cp>Copier le numéro</button></div>
  <ol><li>Ouvre Natcash et choisis « Envoyer de l’argent ».</li><li>Entre le numéro ci-dessus et le montant exact en HTG.</li><li>Copie l’ID de transaction reçu par SMS.</li><li>Colle-le ci-dessous pour confirmer.</li></ol>
  <label for="tx">ID de transaction Natcash</label><input class="inp" id="tx" autocomplete="off" placeholder="Ex. NC8472916"><div class="err" id="e3"></div><button class="btn" data-ok>J’ai payé · Confirmer</button><button class="btn g" data-b style="margin-top:10px">Retour</button></div>`};
 draw();
 o.addEventListener("click",async e=>{const t=e.target;
  if(t===o||t.closest("[data-x]"))return close();
  if(t.closest("[data-b]")){step--;draw()}
  else if(t.closest("[data-cp]")){try{await navigator.clipboard.writeText(NATRAW);toast("Numéro copié ✓")}catch(x){toast("Copie impossible, note le numéro")}}
  else if(t.closest("[data-n]")){
   if(step===2){info.name=o.querySelector("#nm").value.trim();info.tel=o.querySelector("#tl").value.trim();
    if(info.name.length<2)return o.querySelector("#e2").textContent="Entre ton nom complet.";
    if(info.tel.replace(/\D/g,"").length<8)return o.querySelector("#e2").textContent="Entre un numéro valide (8 chiffres minimum)."}
   step++;draw()}
  else if(t.closest("[data-ok]")){const x=o.querySelector("#tx").value.trim();
   if(!/^[A-Za-z0-9-]{6,}$/.test(x)){o.querySelector("#tx").classList.add("bad");return o.querySelector("#e3").textContent="ID invalide : 6 caractères minimum, lettres et chiffres."}
   done={ref:"WIDS-"+Date.now().toString(36).toUpperCase().slice(-6),t:total()};cart=[];save();view();draw()}
 })}
/* Avis clients : exemples de présentation à remplacer par de vrais avis */
const RV=[
[5,"Marie-Ange J.","Pétion-Ville","eFootball Coins",`J’hésitais à commander en ligne, mais WIDS-STORE m’a tout de suite mise en confiance : prix clairs en gourdes, instructions Natcash détaillées et réponse rapide. J’ai envoyé mon paiement, collé l’ID de transaction et mes Coins étaient crédités peu après. Je recommande à tous les joueurs.`],
[4.9,"Wedson P.","Cap-Haïtien","Free Fire Diamants",`Troisième commande de diamants et toujours le même sérieux. Le catalogue est facile à parcourir sur mon téléphone, le panier garde mes choix et la livraison arrive vite. Ce qui me rassure, c’est la référence de commande donnée à chaque fois : je sais que mon achat est suivi.`],
[4.8,"Stéphanie L.","Delmas","Netflix",`Je cherchais un site fiable pour mon abonnement Netflix payable en HTG sans carte bancaire. Le parcours est simple, le total est exact dès le départ et il n’y a aucune mauvaise surprise. L’équipe est restée polie et claire du début à la fin.`],
[5,"Jean-Rodrigue D.","Les Cayes","Crédit Digicel",`J’utilise WIDS-STORE chaque semaine pour recharger le crédit de ma famille. Le service est disponible même tard le soir, les montants sont affichés sans frais cachés et chaque recharge est arrivée comme annoncé. Un vrai gain de temps.`],
[4.7,"Kevenson B.","Gonaïves","PUBG Mobile UC",`Interface très agréable, rapide même avec une connexion moyenne. J’ai pris des UC pour la saison et tout s’est bien passé. J’apprécie que le site explique chaque étape du paiement Natcash : même un débutant s’y retrouve sans stress.`],
[4.9,"Nadège C.","Port-de-Paix","PlayStation Store",`J’ai acheté une carte PlayStation pour mon frère. Le code est arrivé par e-mail comme prévu et la carte a fonctionné du premier coup. Le sérieux et la transparence de WIDS-STORE font la différence avec d’autres vendeurs rencontrés sur les réseaux.`],
[4.6,"Mackenson T.","Jacmel","Recharge de balance",`J’ai rechargé ma balance en gourdes avec Natcash. La demande a été enregistrée avec une référence et le suivi était clair. Je garde de l’avance sur mon solde pour acheter plus vite quand une offre m’intéresse. Pratique et sécurisant.`]
];
const avg=()=>(RV.reduce((t,r)=>t+r[0],0)/RV.length).toFixed(1);
function reviewsHTML(col){return `<p style="color:var(--mu);font-size:12px;margin:-6px 0 10px"><span class="st">★</span> <b style="color:var(--tx)">${avg()}/5</b> · ${RV.length} avis · exemples de présentation</p><div class="rvs ${col?"col":""}">${RV.map(r=>`<article class="glass rv"><div class="row" style="justify-content:flex-start;margin-bottom:10px"><div class="av">${r[1][0]}</div><div><strong>${r[1]}</strong><br><small style="color:var(--mu)">${r[2]} · ${r[3]}</small></div></div><div class="st" aria-label="Note ${r[0]} sur 5">${"★".repeat(Math.round(r[0]))} <small style="color:var(--tx);letter-spacing:0">${r[0]}/5</small></div><p style="margin-top:8px;color:#c9cddb;font-size:14px">${r[4]}</p></article>`).join("")}</div>`}
/* Balance */
function balHTML(){return `<section class="glass hero"><small style="color:var(--mu)">Solde disponible</small><div style="font-size:36px;font-weight:800;color:var(--em);text-shadow:0 0 22px rgba(52,211,153,.4)">${fmt(bal)}</div><p>Recharge ta balance en gourdes via Natcash.</p><button class="btn" id="rc">Recharger ma balance</button></section><h2>Demandes de recharge</h2>${reqs.length?reqs.map(r=>`<div class="glass line"><div class="ico">💳</div><div><strong>${fmt(r.amt)}</strong><small>${r.ref} · ${r.d}</small></div><span class="bg"><span style="color:#fbbf24">${r.s}</span></span></div>`).join(""):`<div class="empty">Aucune demande pour le moment.</div>`}`}
function openRecharge(){
 close();let amt=1000,step=1,ref="";const PR=[500,1000,2500,5000];
 const o=document.createElement("div");o.className="ov";document.body.appendChild(o);
 const draw=()=>{
  if(step===3)return o.innerHTML=`<div class="sheet"><div class="ok"><div class="tick">✓</div><h2 style="margin:0 0 6px">Demande envoyée</h2><p style="color:var(--mu)">Référence <b style="color:var(--cy)">${ref}</b><br>Ta balance sera créditée de ${fmt(amt)} après vérification du paiement.</p></div><button class="btn" data-x>Fermer</button></div>`;
  if(step===1)o.innerHTML=`<div class="sheet"><div class="row"><strong style="font-size:18px">Recharger ma balance</strong><button class="ib" data-x aria-label="Fermer">✕</button></div><div class="pk">${PR.map(v=>`<button class="pack ${v===amt?"on":""}" data-am="${v}"><b>${fmt(v)}</b></button>`).join("")}</div><label for="ca">Autre montant (HTG)</label><input class="inp" id="ca" inputmode="numeric" placeholder="Min. 100" value="${PR.includes(amt)?"":amt}"><div class="err" id="ea"></div><button class="btn" data-n>Continuer</button></div>`;
  if(step===2)o.innerHTML=`<div class="sheet"><div class="row"><strong style="font-size:18px">Paiement Natcash</strong><button class="ib" data-x aria-label="Fermer">✕</button></div><div class="glass nat" style="margin-top:14px"><small style="color:var(--mu)">Montant exact à envoyer</small><div class="amt">${fmt(amt)}</div><small style="color:var(--mu)">Numéro Natcash</small><div class="num">${NAT}</div><button class="btn g" data-cp>Copier le numéro</button></div><ol><li>Envoie le montant exact à ce numéro avec Natcash.</li><li>Copie l’ID de transaction reçu par SMS.</li><li>Colle-le ci-dessous pour confirmer.</li></ol><label for="tx">ID de transaction Natcash</label><input class="inp" id="tx" autocomplete="off"><div class="err" id="e3"></div><button class="btn" data-ok>J’ai payé · Confirmer</button><button class="btn g" data-b style="margin-top:10px">Retour</button></div>`};
 draw();
 o.addEventListener("click",async e=>{const t=e.target,am=t.closest("[data-am]");
  if(t===o||t.closest("[data-x]"))return close();
  if(am){amt=+am.dataset.am;draw()}
  else if(t.closest("[data-b]")){step=1;draw()}
  else if(t.closest("[data-cp]")){try{await navigator.clipboard.writeText(NATRAW);toast("Numéro copié ✓")}catch(x){toast("Copie impossible, note le numéro")}}
  else if(t.closest("[data-n]")){const v=o.querySelector("#ca").value.trim();if(v){if(!/^\d+$/.test(v)||+v<100||+v>100000)return o.querySelector("#ea").textContent="Entre un montant entier entre 100 et 100,000 HTG.";amt=+v}step=2;draw()}
  else if(t.closest("[data-ok]")){const x=o.querySelector("#tx").value.trim();
   if(!/^[A-Za-z0-9-]{6,}$/.test(x)){o.querySelector("#tx").classList.add("bad");return o.querySelector("#e3").textContent="ID invalide : 6 caractères minimum, lettres et chiffres."}
   ref="BAL-"+Date.now().toString(36).toUpperCase().slice(-6);reqs.unshift({ref,amt,d:new Date().toLocaleDateString("fr-FR"),s:"En vérification"});try{localStorage.setItem("wids-reqs",JSON.stringify(reqs))}catch(e){}step=3;draw();view()}
 })}
/* Menu */
function openMenu(){close();const o=document.createElement("div");o.className="ov dr";document.body.appendChild(o);
 const M=[["home","🏠","Accueil"],["cat","🧩","Catalogue"],["ef","⚽","eFootball"],["bal","💳","Ma balance"],["avis","⭐","Avis clients"],["cart","🛒","Panier"]];
 o.innerHTML=`<aside class="drawer" role="dialog" aria-label="Menu"><div class="row" style="margin-bottom:10px"><div class="logo"><i>W</i><span>WIDS<b>-STORE</b></span></div><button class="ib" data-x aria-label="Fermer">✕</button></div>${M.map(m=>`<button class="mi ${m[0]===tab?"on":""}" data-t="${m[0]}"><span>${m[1]}</span>${m[2]}</button>`).join("")}<small style="margin-top:auto;color:var(--mu)">Paiement Natcash · ${NAT}</small></aside>`;
 o.addEventListener("click",e=>{if(e.target===o||e.target.closest("[data-x]"))close()})}
/* Événements globaux */
document.addEventListener("click",e=>{const t=e.target;
 const tb=t.closest("[data-t]");if(tb&&!tb.closest("nav")||tb){close();tab=tb.dataset.t;view();scrollTo(0,0);return}
 const c=t.closest("[data-c]");if(c){cat=c.dataset.c;if(tab==="home")tab="cat";view();return}
 const p=t.closest("[data-p]");if(p){openSheet(p.dataset.p);return}
 const ep=t.closest("[data-ep]");if(ep){efId=$("#efid").value;efPack=+ep.dataset.ep;view();return}
 if(t.closest("#efadd")){const g=$("#efid").value.trim();efId=g;if(g.length<3){$("#efid").classList.add("bad");$("#efe").textContent="Entre ton ID joueur eFootball (3 caractères minimum).";return}addCart("ef",efPack,g,1);return}
 const m=t.closest("[data-m]"),a=t.closest("[data-a]");
 if(m){const l=cart[+m.dataset.m];l.q--;if(l.q<1)cart.splice(+m.dataset.m,1);save();view();return}
 if(a){const l=cart[+a.dataset.a];l.q=Math.min(20,l.q+1);save();view();return}
 if(t.closest("#go"))openCheckout();
 if(t.closest("#cartBtn")){tab="cart";view()}
 if(t.closest("#menuBtn"))openMenu();
 if(t.closest("#rc"))openRecharge();
});
document.addEventListener("input",e=>{if(e.target.id==="s"){q=e.target.value;if(tab==="home"){tab="cat"}const pos=q.length;view();const s=$("#s");s.focus();s.setSelectionRange(pos,pos)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
view();
</script></body></html>
